# Wasmer Edge hosting for TOGG.
# 1) npm run build      2) wasmer deploy
# The site is the built "dist" folder, served by static-web-server.
[dependencies]
"wasmer/static-web-server" = "^1"

[fs]
"/public" = "dist"
"/settings" = "wasmer-settings"

[[command]]
name = "script"
module = "wasmer/static-web-server:webserver"
runner = "https://webc.org/runner/wasi"

[command.annotations.wasi]
main-args = ["--config-file", "/settings/config.toml"]
