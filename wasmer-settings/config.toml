# static-web-server settings used on Wasmer Edge
[general]
root = "/public"
# TOGG is a single-page app: links like /join, /visit, /prayer and /give/... must load index.html
# (otherwise phones that scan a QR code get "404 Not Found").
page-fallback = "/public/index.html"
# Any other unknown address: serve the app too (it shows its own "Page not found" with a Back button).
page404 = "/public/404.html"
